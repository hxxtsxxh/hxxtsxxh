<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" role="img" aria-labelledby="t d">
<title id="t">Heet Shah</title>
<desc id="d">Software Developer at IBM Silicon Valley Lab building agentic AI, evaluation infrastructure, and intelligent systems. An animated agent trace runs task, plan, call tool, observe, verify, ship.</desc>
<defs>
<pattern id="g" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#e4e8ec"/></pattern>
<linearGradient id="f" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="880" height="236" fill="url(#f)"/></mask>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}
.mono,.lbl{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.eyebrow{font-size:12px;letter-spacing:2.6px;fill:#059669;font-weight:600}
.name{font-size:62px;font-weight:700;letter-spacing:-1.8px;fill:#1f2328}
.tag{font-size:16px;fill:#59636e}
.lbl{font-size:13px;fill:#818b98}
.acc{fill:#059669}
.base{stroke:#d1d9e0;stroke-width:1.5}
.run{stroke:#059669;stroke-width:1.5;stroke-dasharray:800;stroke-dashoffset:800;animation:draw 7.0s linear infinite}
.n{fill:#ffffff;stroke:#d1d9e0;stroke-width:1.5;animation:lit 7.0s linear infinite}
.head{fill:#059669;animation:move 7.0s linear infinite}
.cur{fill:#059669;animation:blink 1.1s steps(1) infinite}
.n0{animation-delay:0.00s}.n1{animation-delay:1.00s}.n2{animation-delay:2.00s}.n3{animation-delay:3.00s}.n4{animation-delay:4.00s}.n5{animation-delay:5.00s}
@keyframes draw{0%{stroke-dashoffset:800;opacity:1}71.4%{stroke-dashoffset:0;opacity:1}79.4%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes move{0%{transform:translateX(0);opacity:1}71.4%{transform:translateX(800px);opacity:1}75.4%,100%{transform:translateX(800px);opacity:0}}
@keyframes lit{0%{fill:#059669;stroke:#059669}12.9%,100%{fill:#ffffff;stroke:#d1d9e0}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.run,.n,.head,.cur{animation:none}.run{stroke-dashoffset:0}.head{opacity:0}}
</style>
<rect width="880" height="236" fill="url(#g)" mask="url(#m)"/>
<text class="mono eyebrow" x="40" y="44">SOFTWARE DEVELOPER · IBM SILICON VALLEY LAB</text>
<text class="name" x="37" y="108">Heet Shah</text>
<text class="mono tag" x="40" y="142">agents · evals · intelligent systems</text>
<rect class="cur" x="392" y="129" width="9" height="17" rx="1"/>
<line class="base" x1="40" y1="186" x2="840" y2="186"/>
<line class="run" x1="40" y1="186" x2="840" y2="186"/>
<circle class="n n0" cx="40" cy="186" r="5"/><circle class="n n1" cx="200" cy="186" r="5"/><circle class="n n2" cx="360" cy="186" r="5"/><circle class="n n3" cx="520" cy="186" r="5"/><circle class="n n4" cx="680" cy="186" r="5"/><circle class="n n5" cx="840" cy="186" r="5"/>
<circle class="head" cx="40" cy="186" r="3.5"/>
<text class="lbl" x="40" y="214" text-anchor="start">task</text><text class="lbl" x="200" y="214" text-anchor="middle">plan</text><text class="lbl" x="360" y="214" text-anchor="middle">call_tool</text><text class="lbl" x="520" y="214" text-anchor="middle">observe</text><text class="lbl acc" x="680" y="214" text-anchor="middle">verify</text><text class="lbl" x="840" y="214" text-anchor="end">ship</text>
</svg>
